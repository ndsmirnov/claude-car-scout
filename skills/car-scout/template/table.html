<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Подбор машины</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#1d1d1f; --mute:#6e6e73; --line:#e3e1dc;
          --ok:#1f8a4c; --warn:#b7791f; --bad:#c0392b; --chip:#efede8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151515; --card:#1f1f1f; --ink:#f2f2f2; --mute:#a0a0a5; --line:#333;
            --ok:#4cc27e; --warn:#e0a84a; --bad:#ec6a5c; --chip:#2a2a2a; }
  }
  * { box-sizing:border-box; }
  html, body { overflow-x:hidden; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding:20px 16px 8px; max-width:1200px; margin:0 auto; }
  h1 { margin:0 0 4px; font-size:22px; }
  .sub { color:var(--mute); }
  .bar { display:flex; flex-wrap:wrap; gap:8px; padding:8px 16px 16px; max-width:1200px; margin:0 auto; }
  .bar button, .bar select { border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:999px; padding:6px 12px; font:inherit; cursor:pointer; }
  .bar button.on { background:var(--ink); color:var(--bg); }
  main { max-width:1200px; margin:0 auto; padding:0 16px 40px; display:grid; gap:12px; grid-template-columns:repeat(auto-fill, minmax(min(320px, 100%), 1fr)); }
  .car { min-width:0; overflow-wrap:anywhere; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:8px; }
  .top { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
  .title { font-weight:600; font-size:16px; }
  .price { font-weight:600; white-space:nowrap; }
  .meta { color:var(--mute); font-size:13px; }
  .v { font-size:12px; font-weight:600; padding:2px 8px; border-radius:999px; color:#fff; }
  .v.candidate { background:var(--ok); } .v.caution { background:var(--warn); } .v.reject { background:var(--bad); }
  .scores { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:6px; }
  .s { background:var(--chip); border-radius:10px; padding:6px; text-align:center; }
  .s b { display:block; font-size:16px; } .s span { font-size:10px; color:var(--mute); overflow-wrap:normal; letter-spacing:-0.2px; }
  .s { padding:6px 2px !important; }
  .flags { margin:0; padding-left:18px; color:var(--bad); font-size:14px; }
  .q { margin:0; padding-left:18px; font-size:14px; }
  .why { font-size:13px; color:var(--mute); }
  a { color:inherit; }
  .empty { color:var(--mute); padding:40px 16px; text-align:center; grid-column:1/-1; }
</style>
</head>
<body>
<header>
  <h1>Подбор машины</h1>
  <div class="sub" id="sum"></div>
</header>
<div class="bar">
  <button data-f="all" class="on">Все</button>
  <button data-f="candidate">Кандидаты</button>
  <button data-f="caution">Осторожно</button>
  <button data-f="reject">Отказ</button>
  <select id="sort">
    <option value="price">Сначала дешевле</option>
    <option value="year_cost">Дешевле в содержании</option>
    <option value="safety">Безопаснее</option>
    <option value="liquidity">Легче продать</option>
    <option value="reliability">Надёжнее</option>
  </select>
</div>
<main id="list"></main>
<script>
const CARS = [];

const VN = { candidate:"кандидат", caution:"осторожно", reject:"отказ" };
const rub = n => n == null ? "—" : n.toLocaleString("ru-RU") + " ₽";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
let filter = "all";

function render() {
  const key = document.getElementById("sort").value;
  const asc = key === "price" || key === "year_cost";
  const rows = CARS.filter(c => filter === "all" || c.verdict === filter)
    .sort((a, b) => asc ? (a[key] ?? 1e12) - (b[key] ?? 1e12) : (b[key] ?? 0) - (a[key] ?? 0));
  const n = v => CARS.filter(c => c.verdict === v).length;
  document.getElementById("sum").textContent =
    `${CARS.length} объявлений · кандидатов ${n("candidate")} · осторожно ${n("caution")} · отказ ${n("reject")}`;
  document.getElementById("list").innerHTML = rows.length ? rows.map(c => `
    <article class="car">
      <div class="top"><span class="title">${esc(c.title)}</span><span class="price">${rub(c.price)}</span></div>
      <div><span class="v ${esc(c.verdict)}">${VN[c.verdict] || "не оценено"}</span></div>
      <div class="meta">${[c.mileage && c.mileage.toLocaleString("ru-RU") + " км", c.engine, c.gearbox, c.drive, c.city,
        c.owners && "владельцев: " + c.owners, c.pts && "ПТС: " + c.pts].filter(Boolean).map(esc).join(" · ")}</div>
      <div class="scores">
        <div class="s"><b>${c.safety ?? "—"}</b><span>безопасность</span></div>
        <div class="s"><b>${c.reliability ?? "—"}</b><span>надёжность</span></div>
        <div class="s"><b>${c.liquidity ?? "—"}</b><span>ликвидность</span></div>
        <div class="s"><b>${c.year_cost ? Math.round(c.year_cost / 1000) + "к" : "—"}</b><span>₽ в год${c.year_cost_source === "avito" ? "" : "*"}</span></div>
      </div>
      ${c.flags && c.flags.length ? `<ul class="flags">${c.flags.map(f => `<li>${esc(f)}</li>`).join("")}</ul>` : ""}
      ${c.desc_checked === false ? `<div class="why">⚠ Описание продавца не проверено</div>` : ""}
      ${c.questions && c.questions.length ? `<div><b>Спросить продавца:</b><ul class="q">${c.questions.map(q => `<li>${esc(q)}</li>`).join("")}</ul></div>` : ""}
      ${c.why ? `<div class="why">${esc(c.why)}</div>` : ""}
      ${c.url ? `<a href="${esc(c.url)}" target="_blank" rel="noopener">Открыть на Авито →</a>` : ""}
    </article>`).join("") : `<div class="empty">Пока пусто. Скажи Claude «подбери машину».</div>`;
}
document.querySelectorAll(".bar button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".bar button").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); filter = b.dataset.f; render();
});
document.getElementById("sort").onchange = render;
render();
</script>
<p style="max-width:1200px;margin:0 auto;padding:0 16px 24px;color:var(--mute);font-size:12px">* стоимость владения — прикидка, а не цифра с Авито.</p>
</body>
</html>
